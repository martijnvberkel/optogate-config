<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optogate Settings</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2024; --mute:#667085; --line:#e3e6ea; --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --bar:#e8ebef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --card:#1d2125; --ink:#e8eaed; --mute:#9aa3ad; --line:#2c3238; --accent:#6ea0ff; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --bar:#2a3037; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.35 system-ui, sans-serif; }
  main { max-width:980px; margin:0 auto; padding:10px 14px; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  h1 { font-size:1.1rem; margin:0 8px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .top { display:grid; grid-template-columns:1.6fr 1fr; gap:10px; margin-bottom:10px; }
  .cols { display:grid; grid-template-columns:repeat(3, 1fr); gap:0 22px; }
  h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); margin:0 0 6px; font-weight:600; }
  button { font:inherit; padding:6px 12px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  #status { color:var(--mute); }
  #status.err { color:var(--bad); }
  .meter { position:relative; height:18px; background:var(--bar); border-radius:5px; overflow:hidden; }
  .meter .fill { position:absolute; inset:0 auto 0 0; width:0; background:var(--accent); opacity:.85; }
  .meter .mark { position:absolute; top:0; bottom:0; width:2px; background:var(--ink); opacity:.7; }
  .live { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; align-items:center; }
  .big { font-size:1.35rem; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1; }
  .hint { color:var(--mute); font-size:.8rem; }
  .gate .fill { background:var(--ok); }
  .set { margin:0 0 9px; }
  .set .l { display:flex; justify-content:space-between; gap:8px; }
  .set label { font-weight:600; }
  .set output { font-variant-numeric:tabular-nums; color:var(--mute); }
  .set input[type=range] { width:100%; margin:2px 0 0; accent-color:var(--accent); }
  .actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:2px; }
  .teachbtns { display:flex; flex-direction:column; gap:6px; margin:6px 0; }
  #msg, #msg2 { min-height:1.2em; }
  .ok { color:var(--ok); } .err { color:var(--bad); } .warn { color:var(--warn); }
  @media (max-width:760px) { .top, .cols { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Optogate</h1>
    <button id="connect" class="primary">Connect</button>
    <span id="status">Not connected.</span>
    <span class="hint" id="support" hidden></span>
  </header>

  <div class="top">
    <div class="card" id="live" hidden>
      <h2>Live</h2>
      <div class="live">
        <div><span class="hint">Sensor</span><div class="big" id="psval">0</div></div>
        <div>
          <div class="meter" id="psmeter"><div class="fill" id="psfill"></div><div class="mark" id="markoff" title="stays open above"></div><div class="mark" id="markon" title="opens above"></div></div>
          <div class="hint" style="text-align:right">scale 0 - <span id="psmax"></span></div>
        </div>
        <div><span class="hint">Gate</span><div class="big" id="gatestate">-</div></div>
        <div class="meter gate"><div class="fill" id="gatefill"></div></div>
      </div>
    </div>

    <div class="card" id="teach" hidden>
      <h2>Quick sensitivity setup</h2>
      <div class="teachbtns">
        <button id="teachIdle" title="Hold still for 2 s with nobody near">1. Nobody near</button>
        <button id="teachNear" title="Hold still for 2 s with a person at the opening distance">2. Person at opening distance</button>
      </div>
      <div id="msg" class="hint">Each step takes about 2 seconds.</div>
    </div>
  </div>

  <div class="card" id="settings" hidden>
    <div class="cols">
      <div>
        <h2>Timing</h2>
        <div class="set" title="How long the gate takes to open once someone is detected.">
          <div class="l"><label for="attack">Attack (fade in)</label><output id="attack_o"></output></div>
          <input type="range" id="attack" min="1" max="1500" step="1"></div>
        <div class="set" title="How long the gate stays open after the person has left.">
          <div class="l"><label for="close">Close delay (hold)</label><output id="close_o"></output></div>
          <input type="range" id="close" min="0" max="15000" step="50"></div>
        <div class="set" title="How long the gate takes to close after the hold time. 0 = instant.">
          <div class="l"><label for="release">Release (fade out)</label><output id="release_o"></output></div>
          <input type="range" id="release" min="0" max="1500" step="1"></div>
      </div>
      <div>
        <h2>Sensor</h2>
        <div class="set" title="Sensor counts above which the gate opens. Lower = opens from farther away.">
          <div class="l"><label for="pson">Opens above</label><output id="pson_o"></output></div>
          <input type="range" id="pson" min="1" max="2000" step="1"></div>
        <div class="set" title="Keep this below the opening value so the gate does not flutter.">
          <div class="l"><label for="psoff">Stays open above</label><output id="psoff_o"></output></div>
          <input type="range" id="psoff" min="1" max="2000" step="1"></div>
      </div>
      <div>
        <h2>Gate LED range</h2>
        <div class="set" title="The photoMOS only starts to open above this LED level. Raise it if the fade has a dead time at the start.">
          <div class="l"><label for="dlo">Lowest drive</label><output id="dlo_o"></output></div>
          <input type="range" id="dlo" min="0" max="99" step="1"></div>
        <div class="set">
          <div class="l"><label for="dhi">Full drive</label><output id="dhi_o"></output></div>
          <input type="range" id="dhi" min="1" max="100" step="1"></div>
      </div>
    </div>
    <div class="actions">
      <button id="save" class="primary" title="Keeps the settings when the power is off">Save to device</button>
      <button id="defaults">Reset to defaults</button>
      <span id="msg2" class="hint">Changes act immediately; Save keeps them after power-off.</span>
    </div>
  </div>
</main>

<script>
"use strict";
const VID = 0x1209, PID = 0x0001;
const REQ_STATUS = 0x01, REQ_SET = 0x10, REQ_SAVE = 0x11, REQ_DEFAULTS = 0x12;
const ID = { attack:0, close:1, release:2, dlo:3, dhi:4, pson:5, psoff:6 };
const STATES = ["Closed", "Opening", "Open", "Closing"];
const $ = id => document.getElementById(id);

let dev = null, timer = null, last = null, psMaxSeen = 200, sampling = null;
const sliders = ["attack","close","release","pson","psoff","dlo","dhi"];

function setStatus(t, err) { $("status").textContent = t; $("status").className = err ? "err" : ""; }
function say(el, t, cls) { el.textContent = t; el.className = cls || "hint"; }

if (!navigator.usb) {
  $("connect").disabled = true;
  $("support").hidden = false;
  $("support").textContent = "This browser has no WebUSB. Use Chrome or Edge on a computer, or Chrome on an Android phone.";
}

async function connect() {
  try {
    dev = await navigator.usb.requestDevice({ filters: [{ vendorId: VID, productId: PID }] });
    await open(dev);
  } catch (e) { setStatus("Could not connect: " + e.message, true); }
}

async function open(d) {
  dev = d;
  await dev.open();
  if (dev.configuration === null) await dev.selectConfiguration(1);
  await dev.claimInterface(0);
  setStatus("Connected to " + (dev.productName || "Optogate") + ".");
  $("connect").textContent = "Reconnect";
  for (const id of ["live","teach","settings"]) $(id).hidden = false;
  const s = await readStatus();
  applyToSliders(s);
  clearInterval(timer);
  timer = setInterval(poll, 100);
}

async function readStatus() {
  const r = await dev.controlTransferIn({ requestType:"vendor", recipient:"device", request:REQ_STATUS, value:0, index:0 }, 20);
  if (r.status !== "ok" || r.data.byteLength < 20) throw new Error("bad status reply");
  const v = r.data;
  return {
    sensor: v.getUint8(1), state: v.getUint8(2), flashErr: v.getUint8(3),
    ps: v.getUint16(4, true), pos: v.getUint16(6, true),
    attack: v.getUint16(8, true), close: v.getUint16(10, true), release: v.getUint16(12, true),
    dlo: v.getUint8(14), dhi: v.getUint8(15), pson: v.getUint16(16, true), psoff: v.getUint16(18, true)
  };
}

async function sendSet(name, value) {
  const r = await dev.controlTransferOut({ requestType:"vendor", recipient:"device", request:REQ_SET, value:value, index:ID[name] });
  if (r.status !== "ok") throw new Error("rejected");
}
async function sendCmd(req) {
  const r = await dev.controlTransferOut({ requestType:"vendor", recipient:"device", request:req, value:0, index:0 });
  if (r.status !== "ok") throw new Error("rejected");
}

function applyToSliders(s) {
  for (const n of sliders) { $(n).value = s[n]; showVal(n); }
  syncMarks(s);
}
function showVal(n) {
  const v = +$(n).value;
  const unit = (n === "dlo" || n === "dhi") ? " %" : (n === "pson" || n === "psoff") ? "" : " ms";
  $(n + "_o").textContent = v + unit;
}

function syncMarks(s) {
  const max = Math.max(psMaxSeen, s.pson * 1.5, 100);
  $("markon").style.left = (100 * s.pson / max) + "%";
  $("markoff").style.left = (100 * s.psoff / max) + "%";
  $("psmax").textContent = Math.round(max);
}

async function poll() {
  if (!dev) return;
  try {
    const s = await readStatus();
    last = s;
    if (s.ps > psMaxSeen) psMaxSeen = s.ps;
    $("psval").textContent = s.ps;
    const max = Math.max(psMaxSeen, s.pson * 1.5, 100);
    $("psfill").style.width = Math.min(100, 100 * s.ps / max) + "%";
    $("gatestate").textContent = s.sensor ? STATES[s.state] : "No sensor";
    $("gatefill").style.width = (s.pos / 10) + "%";
    syncMarks({ pson: +$("pson").value, psoff: +$("psoff").value });
    if (sampling) sampling.push(s.ps);
  } catch (e) {
    clearInterval(timer); dev = null;
    setStatus("Disconnected. Plug the board in and press Connect.", true);
  }
}

// ---- sliders: send on change, keep dependent limits consistent
let pending = {};
for (const n of sliders) {
  $(n).addEventListener("input", () => {
    if (n === "dlo" && +$("dlo").value >= +$("dhi").value) $("dlo").value = +$("dhi").value - 1;
    if (n === "dhi" && +$("dhi").value <= +$("dlo").value) $("dhi").value = +$("dlo").value + 1;
    if (n === "psoff" && +$("psoff").value > +$("pson").value) $("psoff").value = $("pson").value;
    if (n === "pson" && +$("pson").value < +$("psoff").value) $("pson").value = $("psoff").value;
    showVal(n);
    clearTimeout(pending[n]);
    pending[n] = setTimeout(() => push(n), 80);
  });
}
async function push(n) {
  if (!dev) return;
  try { await sendSet(n, +$(n).value); say($("msg2"), "Changes act immediately; Save keeps them after power-off."); }
  catch (e) { say($("msg2"), "The board rejected " + n + ".", "err"); }
}

// ---- teach buttons
let idleVal = null;
function median(a) { const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; }
async function capture(label) {
  say($("msg"), label + " ...");
  sampling = [];
  await new Promise(r => setTimeout(r, 2000));
  const s = sampling; sampling = null;
  if (s.length < 5) throw new Error("no readings");
  return { med: median(s), max: Math.max(...s) };
}
$("teachIdle").onclick = async () => {
  try {
    const c = await capture("Measuring with nobody near");
    idleVal = c.max;
    say($("msg"), "Nobody near: highest reading " + c.max + ". Now step 2.", "ok");
  } catch (e) { say($("msg"), e.message, "err"); }
};
$("teachNear").onclick = async () => {
  try {
    if (idleVal === null) { say($("msg"), "Do step 1 first.", "warn"); return; }
    const c = await capture("Measuring with a person at the opening distance");
    const gap = c.med - idleVal;
    if (gap < 15) { say($("msg"), "Readings too close (" + idleVal + " and " + c.med + "). Move closer or check the sensor.", "warn"); return; }
    const on = Math.round(idleVal + 0.5 * gap), off = Math.round(idleVal + 0.3 * gap);
    $("pson").value = on; $("psoff").value = off; showVal("pson"); showVal("psoff");
    await sendSet("pson", on); await sendSet("psoff", off);
    say($("msg"), "Set: opens above " + on + ", stays open above " + off + ". Press Save to keep it.", "ok");
  } catch (e) { say($("msg"), e.message, "err"); }
};

function withTimeout(p, ms, what) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(what + " got no answer within " + ms + " ms")), ms))]);
}
$("save").onclick = async () => {
  say($("msg2"), "Saving ...");
  const stage = [];
  try {
    await withTimeout(sendCmd(REQ_SAVE), 3000, "the save command"); stage.push("command sent");
    await new Promise(r => setTimeout(r, 700));
    const s = await withTimeout(readStatus(), 3000, "the status read after saving"); stage.push("status read");
    say($("msg2"), s.flashErr ? "Saving failed (the chip could not verify what it wrote). Try again." : "Saved to the device.", s.flashErr ? "err" : "ok");
  } catch (e) { say($("msg2"), "Save problem after [" + stage.join(", ") + "]: " + e.message, "err"); }
};
$("defaults").onclick = async () => {
  try { await sendCmd(REQ_DEFAULTS); applyToSliders(await readStatus()); say($("msg2"), "Defaults loaded. Not saved yet.", "ok"); }
  catch (e) { say($("msg2"), e.message, "err"); }
};

$("connect").onclick = connect;
if (navigator.usb) {
  navigator.usb.getDevices().then(ds => { const d = ds.find(x => x.vendorId === VID && x.productId === PID); if (d) open(d).catch(() => {}); });
  navigator.usb.addEventListener("disconnect", () => { if (dev) { clearInterval(timer); dev = null; setStatus("Disconnected. Plug the board in and press Connect.", true); } });
}
</script>
</body>
</html>
